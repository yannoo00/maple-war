<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메이플 워 유닛 편집기</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #d9dde3; --text: #1d2229; --muted: #6b7380;
    --accent: #2f6fed; --accent-text: #ffffff; --danger: #d33a3a; --warn: #b8740f; --ok: #1f8a4c;
    --badge-ally: #e3efff; --badge-ally-text: #1f4fa3; --badge-enemy: #ffe6e3; --badge-enemy-text: #a3261f;
    --badge-none: #eceef1; --badge-none-text: #596170; --badge-ok: #dff5e7; --badge-ok-text: #166534;
    --badge-warn: #fff1d6; --badge-warn-text: #8a5a00; --thumb-bg: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --panel: #1e2228; --line: #343a43; --text: #e7eaee; --muted: #9aa3b0;
      --accent: #5b8cff; --danger: #ff6b6b; --warn: #e6a23c; --ok: #4cc27a;
      --badge-ally: #22304a; --badge-ally-text: #9dbcff; --badge-enemy: #4a2622; --badge-enemy-text: #ff9f98;
      --badge-none: #2a2f37; --badge-none-text: #aab2bf; --badge-ok: #1d3b2a; --badge-ok-text: #8fe0b0;
      --badge-warn: #3f3115; --badge-warn-text: #f3c56b; --thumb-bg: #272c34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  .mode { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .mode button { border: 0; border-radius: 0; padding: 6px 14px; }
  .mode button.on { background: var(--accent); color: var(--accent-text); }
  .layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 54px); }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } aside { max-height: 40vh; } }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; }
  aside .tools { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
  aside .tools input { flex: 1; min-width: 120px; }
  .tab { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .row { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .row.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .row .nm { font-weight: 600; }
  .row .id { color: var(--muted); font-size: 12px; }
  .row .main { flex: 1; min-width: 0; }
  .thumb { width: 44px; height: 44px; border-radius: 6px; background: var(--thumb-bg); object-fit: contain; flex: none; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .b-ally { background: var(--badge-ally); color: var(--badge-ally-text); }
  .b-enemy { background: var(--badge-enemy); color: var(--badge-enemy-text); }
  .b-none { background: var(--badge-none); color: var(--badge-none-text); }
  .b-ok { background: var(--badge-ok); color: var(--badge-ok-text); }
  .b-warn { background: var(--badge-warn); color: var(--badge-warn-text); }
  main { padding: 16px; overflow: auto; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 0 0 14px; padding: 10px 14px 12px; }
  legend { font-weight: 600; padding: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 16px; }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
  label.f .k { color: var(--muted); }
  label.f .k b { color: var(--danger); margin-left: 2px; }
  label.f .h { color: var(--muted); font-size: 11px; }
  label.f.wide { grid-column: 1 / -1; }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  input.ruid { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  textarea { min-height: 60px; resize: vertical; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .msgs { margin: 0 0 14px; display: flex; flex-direction: column; gap: 6px; }
  .msg { padding: 8px 12px; border-radius: 6px; border: 1px solid; white-space: pre-wrap; }
  .msg.err { color: var(--danger); border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .msg.warn { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .msg.ok { color: var(--ok); border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  table.waves { border-collapse: collapse; width: 100%; max-width: 520px; }
  table.waves td, table.waves th { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  table.waves input[type=text], table.waves select { padding: 3px 6px; }
  .pool { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .pool label { display: flex; gap: 4px; align-items: center; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  .preview { display: flex; gap: 8px; align-items: center; min-height: 20px; font-size: 11px; color: var(--muted); }
  .preview img { max-height: 96px; max-width: 160px; background: var(--thumb-bg); border-radius: 6px; padding: 2px; }
  .preview .bad { color: var(--danger); }
  .timeline { position: relative; height: 84px; margin: 10px 0 4px; border-bottom: 2px solid var(--line); }
  .timeline .tick { position: absolute; bottom: -18px; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
  .timeline .mark { position: absolute; bottom: 4px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); }
  .timeline .mark img { width: 34px; height: 34px; object-fit: contain; background: var(--thumb-bg); border-radius: 6px; }
  .timeline .mark.lv b { color: var(--accent); }
  .timeline .loop { position: absolute; bottom: 4px; right: 0; font-size: 11px; color: var(--muted); padding: 2px 8px; border: 1px dashed var(--line); border-radius: 6px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 12px; }
  .chip img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; background: var(--thumb-bg); }
  .chip button { padding: 0 6px; border: 0; background: transparent; color: var(--muted); font-size: 14px; line-height: 1; }
  .appear { display: flex; flex-direction: column; gap: 4px; }
  .appear .line { display: flex; gap: 8px; align-items: center; }
  .clip { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .clip pre { flex: 1; margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; font-size: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
</style>
</head>
<body>
<header>
  <h1>유닛 편집기</h1>
  <div class="mode"><button id="modeUnits" class="on">유닛</button><button id="modeStages">스테이지</button><button id="modeEffects">효과</button></div>
  <span id="unitTools">
    <select id="newKind"></select>
    <button id="btnNew">새 유닛</button>
    <button id="btnClone" disabled>복제</button>
  </span>
  <span id="stageTools" hidden>
    <button id="btnNewStage">새 스테이지</button>
    <button id="btnCloneStage" disabled>복제</button>
  </span>
  <span id="effectTools" hidden>
    <button id="btnNewEffect">새 효과</button>
  </span>
  <span class="spacer"></span>
  <span class="muted" id="fileInfo"></span>
  <button id="btnReload">다시 읽기</button>
</header>
<div class="layout">
  <aside>
    <div class="tools" id="unitFilters">
      <button class="tab on" data-kind="">전체</button>
      <button class="tab" data-kind="monster">몬스터</button>
      <button class="tab" data-kind="build">설치물</button>
      <button class="tab" data-kind="skill">스킬</button>
      <input id="search" type="text" placeholder="이름 / id 검색">
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="editor" class="empty">왼쪽에서 항목을 고르거나 "새 유닛" / "새 효과"를 누르세요.</div>
  </main>
</div>
<dialog id="confirm">
  <p id="confirmText"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="confirmNo">취소</button><button id="confirmYes" class="primary">확인</button></div>
</dialog>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  let state = null;
  let mode = 'units';          // 'units' | 'stages' | 'effects'
  const fileFor = () => mode === 'units' ? state.files.units : mode === 'stages' ? state.files.stages : state.files.effects;
  let filterKind = '';
  let search = '';
  let current = null;          // units: { unit, waves, loopPool, isNew, originalId } / effects: { effect, isNew, originalId }
  let dirty = false;
  const resourceCache = new Map();

  async function api(method, url, body) {
    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    return r.json();
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  const isRuid = (v) => /^[0-9a-f]{32}$/i.test(v || '');

  async function resource(ruid) {
    ruid = (ruid || '').toLowerCase();
    if (!isRuid(ruid)) return null;
    if (!resourceCache.has(ruid)) resourceCache.set(ruid, api('GET', '/api/resource/' + ruid));
    return resourceCache.get(ruid);
  }

  async function load(keepSelection) {
    state = await api('GET', '/api/state');
    $('#fileInfo').textContent = fileFor().replace(/\\/g, '/');
    const nk = $('#newKind');
    nk.innerHTML = state.schema.kinds.map((k) => `<option value="${k}">${state.schema.kindLabels[k]}</option>`).join('');
    renderList();
    if (keepSelection && current && !current.isNew) {
      const id = current.originalId;
      if (mode === 'units') { if (state.units.find((x) => x.UnitId === id)) selectUnit(id); else { current = null; renderEditor(); } }
      else if (mode === 'stages') { if (state.stages.find((x) => x.StageId === id)) selectStage(id); else { current = null; renderEditor(); } }
      else { if (state.effects.find((x) => x.EffectId === id)) selectEffect(id); else { current = null; renderEditor(); } }
    }
  }

  function confirmDialog(text) {
    return new Promise((resolve) => {
      const d = $('#confirm');
      $('#confirmText').textContent = text;
      const done = (v) => { d.close(); $('#confirmYes').onclick = $('#confirmNo').onclick = null; resolve(v); };
      $('#confirmYes').onclick = () => done(true);
      $('#confirmNo').onclick = () => done(false);
      d.showModal();
    });
  }
  function guard(fn) {
    if (!dirty) return fn();
    confirmDialog('저장하지 않은 변경이 있습니다. 버리고 이동할까요?').then((ok) => { if (ok) { dirty = false; fn(); } });
  }
  function showMsgs(r, savedText) {
    const m = $('#msgs');
    if (!m) return;
    const items = [];
    for (const e of r.errors || []) items.push(`<div class="msg err">${esc(e)}</div>`);
    for (const w of r.warnings || []) items.push(`<div class="msg warn">${esc(w)}</div>`);
    if (r.ok && savedText) items.push(`<div class="msg ok">${esc(savedText)}</div>`);
    else if (r.ok && !items.length) items.push('<div class="msg ok">문제 없음</div>');
    m.innerHTML = items.join('');
    window.scrollTo({ top: 0 });
  }

  // ---------- mode ----------
  function setMode(m) {
    mode = m; current = null; dirty = false;
    $('#modeUnits').classList.toggle('on', m === 'units');
    $('#modeStages').classList.toggle('on', m === 'stages');
    $('#modeEffects').classList.toggle('on', m === 'effects');
    $('#unitTools').hidden = m !== 'units';
    $('#stageTools').hidden = m !== 'stages';
    $('#effectTools').hidden = m !== 'effects';
    $('#unitFilters').querySelectorAll('.tab').forEach((t) => { t.hidden = m !== 'units'; });
    $('#fileInfo').textContent = fileFor().replace(/\\/g, '/');
    renderList(); renderEditor();
  }

  // ---------- list ----------
  function unitBadges(st) {
    const b = [];
    if (st.starter) b.push('<span class="badge b-ally">스타터</span>');
    else if (st.purchasable) b.push('<span class="badge b-ally">구매</span>');
    if (st.enemy) b.push(`<span class="badge b-enemy">적 ${st.enemyStages.map((s) => s.replace('stage', '')).join(',')}</span>`);
    if (!st.ally && !st.enemy) b.push('<span class="badge b-none">미등장</span>');
    return b.join('');
  }
  function effectBadges(e) {
    const b = [e._status.implemented ? '<span class="badge b-ok">구현됨</span>' : '<span class="badge b-warn">미구현 · 설명만</span>'];
    b.push(e._status.usedBy.length ? `<span class="badge b-none">${e._status.usedBy.length}유닛</span>` : '<span class="badge b-none">미사용</span>');
    return b.join('');
  }
  function renderList() {
    const q = search.trim().toLowerCase();
    const list = $('#list');
    if (mode === 'units') {
      const items = state.units.filter((u) => state.schema.kinds.includes(u.Kind))
        .filter((u) => !filterKind || u.Kind === filterKind)
        .filter((u) => !q || u.UnitId.toLowerCase().includes(q) || (u.Name || '').toLowerCase().includes(q));
      list.innerHTML = items.map((u) => `
        <div class="row ${current && !current.isNew && current.originalId === u.UnitId ? 'on' : ''}" data-id="${u.UnitId}">
          <img class="thumb" data-ruid="${esc(u.Kind === 'skill' ? u.EffectRuid : u.StandRuid)}" alt="">
          <div class="main"><div class="nm">${esc(u.Name)}</div><div class="id">${u.UnitId} · ${state.schema.kindLabels[u.Kind]} · 코스트 ${u.Cost}</div></div>
          <div class="badges">${unitBadges(u._status)}</div>
        </div>`).join('') || '<div class="empty">없음</div>';
      list.querySelectorAll('.row').forEach((el) => el.addEventListener('click', () => guard(() => selectUnit(el.dataset.id))));
    } else if (mode === 'stages') {
      const items = state.stages.filter((s) => !q || s.StageId.toLowerCase().includes(q) || (s.Name || '').toLowerCase().includes(q));
      list.innerHTML = items.map((s) => `
        <div class="row ${current && !current.isNew && current.originalId === s.StageId ? 'on' : ''}" data-id="${s.StageId}">
          <div class="main"><div class="nm">${esc(s.Name)}</div><div class="id">${s.StageId} · 맵 ${esc(s.MapName)} · 기지 HP ${s.BaseHp}</div></div>
          <div class="badges">
            <span class="badge b-enemy">시간표 ${s._status.waveCount} · ${s._status.lastWaveTime}초</span>
            ${s._status.pool.length ? `<span class="badge b-none">반복 ${s._status.pool.length}</span>` : '<span class="badge b-warn">반복 없음</span>'}
            ${s._status.mapExists ? '' : '<span class="badge b-warn">맵 없음</span>'}
          </div>
        </div>`).join('') || '<div class="empty">없음</div>';
      list.querySelectorAll('.row').forEach((el) => el.addEventListener('click', () => guard(() => selectStage(el.dataset.id))));
    } else {
      const items = state.effects.filter((e) => !q || e.EffectId.toLowerCase().includes(q) || (e.Name || '').toLowerCase().includes(q));
      list.innerHTML = items.map((e) => `
        <div class="row ${current && !current.isNew && current.originalId === e.EffectId ? 'on' : ''}" data-id="${e.EffectId}">
          <div class="main"><div class="nm">${esc(e.Name)}</div><div class="id">${e.EffectId} · ${esc(e.Type)} · ${e.Duration}초</div></div>
          <div class="badges">${effectBadges(e)}</div>
        </div>`).join('') || '<div class="empty">없음</div>';
      list.querySelectorAll('.row').forEach((el) => el.addEventListener('click', () => guard(() => selectEffect(el.dataset.id))));
    }
    fillThumbs(list);
  }
  function fillThumbs(root) {
    root.querySelectorAll('img.thumb[data-ruid]').forEach(async (img) => {
      const r = await resource(img.dataset.ruid);
      if (r && r.ok && r.thumbnail) { img.src = r.thumbnail; img.title = `${r.name} (${r.type})`; }
      else img.removeAttribute('src');
    });
  }

  // ---------- unit editor ----------
  function selectUnit(id) {
    const u = state.units.find((x) => x.UnitId === id);
    if (!u) return;
    const unit = {};
    for (const h of state.schema.header) unit[h] = u[h] == null ? '' : u[h];
    current = { unit, enemyStages: [...u._status.enemyStages], isNew: false, originalId: id };
    dirty = false; renderList(); renderEditor();
  }
  function newUnit(kind, from) {
    const unit = {};
    for (const h of state.schema.header) unit[h] = '';
    for (const f of state.schema.fields) if (f.kinds.includes(kind) && f.default != null) unit[f.key] = f.default;
    if (from) for (const h of state.schema.header) unit[h] = from[h] == null ? '' : from[h];
    unit.Kind = kind; unit.UnitId = '';
    if (from) unit['#Memo'] = '';
    current = { unit, enemyStages: [], isNew: true, originalId: null };
    dirty = false; renderList(); renderEditor();
  }
  function widget(f, v, kind, effectsForSelect) {
    const req = (Array.isArray(f.required) ? f.required.includes(kind) : f.required === true) ? '<b>*</b>' : '';
    const help = f.help ? `<span class="h">${esc(f.help)}</span>` : '';
    let input;
    if (f.type === 'enum') {
      const labels = state.schema.enumLabels[f.key] || {};
      input = `<select data-key="${f.key}"><option value="">${f.key === 'Kind' ? '' : '(빈칸)'}</option>${f.enum.map((e) => `<option value="${e}" ${v === e ? 'selected' : ''}>${esc(labels[e] || state.schema.kindLabels[e] || e)} (${e})</option>`).join('')}</select>`;
    } else if (f.type === 'effect') {
      input = `<select data-key="${f.key}"><option value="">(없음)</option>${effectsForSelect.map((e) => `<option value="${e.EffectId}" ${v === e.EffectId ? 'selected' : ''}>${esc(e.Name)} (${e.EffectId} · ${e.Type}${e._status.implemented ? '' : ' · 미구현'})</option>`).join('')}</select>`;
    } else if (f.type === 'map') {
      const maps = state.schema.maps;
      const extra = v && !maps.includes(v) ? `<option value="${esc(v)}" selected>${esc(v)} (map/ 폴더에 없음)</option>` : '';
      input = `<select data-key="${f.key}"><option value="">(선택)</option>${maps.map((m) => `<option value="${esc(m)}" ${v === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}${extra}</select>`;
    } else if (f.type === 'stage') {
      const self = current && current.stage ? current.originalId : null;
      input = `<select data-key="${f.key}"><option value="">(없음 · 처음부터 열림)</option>${state.stages.filter((s) => s.StageId !== self).map((s) => `<option value="${s.StageId}" ${v === s.StageId ? 'selected' : ''}>${esc(s.Name)} (${s.StageId})</option>`).join('')}</select>`;
    } else if (f.type === 'bool') {
      input = `<select data-key="${f.key}"><option value="0" ${v !== '1' ? 'selected' : ''}>아니오 (0)</option><option value="1" ${v === '1' ? 'selected' : ''}>예 (1)</option></select>`;
    } else if (f.type === 'memo') {
      input = `<textarea data-key="${f.key}">${esc(v)}</textarea>`;
    } else if (f.type === 'ruid') {
      input = `<input type="text" data-key="${f.key}" value="${esc(v)}" class="ruid" maxlength="32" placeholder="32자리 RUID"><div class="preview" data-preview="${f.key}"></div>`;
    } else {
      input = `<input type="text" data-key="${f.key}" value="${esc(v)}" ${f.type === 'number' ? 'inputmode="decimal"' : ''}>`;
    }
    return `<label class="f ${f.type === 'memo' ? 'wide' : ''}"><span class="k">${esc(f.label)} <code>${f.key}</code>${req}</span>${input}${help}</label>`;
  }
  async function updatePreview(el, key, value) {
    const box = el.querySelector(`[data-preview="${key}"]`);
    if (!box) return;
    if (!value) { box.innerHTML = ''; return; }

      const id = current.originalId;
      const used = state.effects.find((x) => x.EffectId === id)._status.usedBy;
      const text = used.length ? `"${id}"를 지우고 이 효과를 쓰는 유닛(${used.join(', ')})의 Effect 칸도 비울까요?` : `"${id}"를 지울까요?`;
      if (!(await confirmDialog(text))) return;
      const r = await api('DELETE', `/api/effect/${encodeURIComponent(id)}?force=1`);
      if (r.ok) { current = null; dirty = false; await load(false); renderEditor(); }
      else alert((r.errors || [r.error]).join('\n'));
    });
    refresh();
  }

  function renderEditor() {
    const el = $('#editor');
    $('#btnClone').disabled = !(mode === 'units' && current && !current.isNew);
    $('#btnCloneStage').disabled = !(mode === 'stages' && current && !current.isNew);
    if (!current) {
      el.className = 'empty';
      el.textContent = mode === 'units' ? '왼쪽에서 유닛을 고르거나 "새 유닛"을 누르세요.' : mode === 'stages' ? '왼쪽에서 스테이지를 고르거나 "새 스테이지"를 누르세요.' : '왼쪽에서 효과를 고르거나 "새 효과"를 누르세요.';
      return;
    }
    if (mode === 'units') renderUnitEditor(); else if (mode === 'stages') renderStageEditor(); else renderEffectEditor();
  }

  // ---------- wiring ----------
  $('#modeUnits').addEventListener('click', () => guard(() => setMode('units')));
  $('#modeStages').addEventListener('click', () => guard(() => setMode('stages')));
  $('#modeEffects').addEventListener('click', () => guard(() => setMode('effects')));
  $('#btnNew').addEventListener('click', () => guard(() => newUnit($('#newKind').value)));
  $('#btnClone').addEventListener('click', () => guard(() => newUnit(current.unit.Kind, current.unit)));
  $('#btnNewStage').addEventListener('click', () => guard(() => newStage(null)));
  $('#btnCloneStage').addEventListener('click', () => guard(() => newStage(state.stages.find((x) => x.StageId === current.originalId))));
  $('#btnNewEffect').addEventListener('click', () => guard(() => newEffect()));
  $('#btnReload').addEventListener('click', () => guard(() => load(true)));
  $('#search').addEventListener('input', (e) => { search = e.target.value; renderList(); });
  document.querySelectorAll('#unitFilters .tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('#unitFilters .tab').forEach((x) => x.classList.remove('on')); t.classList.add('on'); filterKind = t.dataset.kind; renderList();
  }));
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  load(false);
})();
</script>
</body>
</html>
